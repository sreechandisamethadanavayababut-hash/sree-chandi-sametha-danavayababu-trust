<!DOCTYPE html>
<html>
<head>
<title>Our Donators</title>
<link rel="stylesheet" href="style.css">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>

<body>

<header>
<h1>🙏 Our Donators 🙏</h1>

<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="events.html">Events</a>
<a href="donate.html">Donate</a>
<a href="contact.html">Contact</a>
<a href="donators.html">Our Donators</a>
</nav>
</header>

<section class="donators-container">

<div style="text-align:center;margin:20px;">
<button onclick="filterDonors('all')">All</button>
<button onclick="filterDonors('vvip')">👑 VVIP</button>
<button onclick="filterDonors('normal')">🙏 Normal</button>
</div>

<h2 id="totalAmount">💰 Total Collected: ₹0</h2>

<div style="text-align:center;">
<button onclick="adminLogin()">🔐 Admin Login</button>
</div>

<div id="adminPanel" style="display:none;text-align:center;">

<input type="text" id="name" placeholder="Enter Name">

<select id="type">
<option value="money">💰 Money</option>
<option value="material">🧱 Material</option>
</select>

<input type="text" id="amount" placeholder="Enter Amount or Material">
<input type="text" id="photo" placeholder="Paste Image URL">
<input type="text" id="designation" placeholder="Designation">

<select id="vipType">
<option value="normal">🙏 Normal</option>
<option value="vvip">👑 VVIP</option>
</select>

<br>
<button id="submitBtn" onclick="addDonor()">Add Donation</button>

</div>

<table class="donators-table">
<thead>
<tr>
<th>S.No</th>
<th>Photo</th>
<th>Full Name</th>
<th>Donation</th>
<th>Designation</th>
<th>Type</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="donorTable"></tbody>
</table>

</section>

<!-- MODAL -->
<div id="donorModal" class="modal">
<div class="modal-content">

<div class="modal-header">
<h1>🛕🙏 Sree Chandi Sametha Danavayababu Temple Trust 🛕🙏</h1>
<span class="close" onclick="closeModal()">×</span>
</div>

<div class="modal-body">
<img id="modalImg">
<div>
<h3 id="modalName"></h3>
<p id="modalAmount"></p>
<p id="modalDesignation"></p>
<p id="modalType"></p>
</div>
</div>

</div>
</div>

<!-- 🔥 GREETING CARD -->
<div id="greetingCard" style="display:none;width:400px;padding:20px;background:linear-gradient(135deg,#ffcc70,#ff8c00);border-radius:20px;text-align:center;">
<h2>🛕🙏 Temple Trust 🙏🛕</h2>
<img id="cardImg" style="width:120px;height:120px;border-radius:50%;object-fit:cover;">
<h3 id="cardName"></h3>
<p id="cardAmount"></p>
<p id="cardDesignation"></p>
<p>🙏 Thank you 🙏</p>
</div>

<footer>
© 2026 Sree Chandi Sametha Danavayababu Trust
</footer>

<script>

let donors = JSON.parse(localStorage.getItem("donors")) || [];
let isAdmin=false;
let editIndex=-1;
let currentFilter="all";

async function translateToTelugu(text){
let res = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=te&dt=t&q="+encodeURIComponent(text));
let data = await res.json();
return data[0][0][0];
}

function filterDonors(type){
currentFilter=type;
displayDonors();
}

function adminLogin(){
let pass=prompt("Enter Password");
if(pass==="Hs@561986"){
isAdmin=true;
document.getElementById("adminPanel").style.display="block";
displayDonors();
}else alert("Wrong Password");
}

async function addDonor(){

if(!isAdmin) return;

let nameVal = document.getElementById("name").value.trim();
let amountVal = document.getElementById("amount").value.trim();
let photoVal = document.getElementById("photo").value.trim();
let designationVal = document.getElementById("designation").value.trim();
let vipVal = document.getElementById("vipType").value;
let typeVal = document.getElementById("type").value;

if(!nameVal || !amountVal){
alert("Enter details");
return;
}

let nameTel = await translateToTelugu(nameVal);
let desTel = designationVal ? await translateToTelugu(designationVal) : "-";

let finalAmount = typeVal==="money" ? "₹"+amountVal : await translateToTelugu(amountVal);

if(editIndex !== -1){
donors[editIndex]={...donors[editIndex],name:nameTel,amount:finalAmount,photo:photoVal,designation:desTel,type:vipVal};
editIndex=-1;
document.getElementById("submitBtn").innerText="Add Donation";
}else{
donors.push({name:nameTel,amount:finalAmount,photo:photoVal,designation:desTel,type:vipVal,status:"pending"});
}

localStorage.setItem("donors",JSON.stringify(donors));
displayDonors();

document.getElementById("name").value="";
document.getElementById("amount").value="";
document.getElementById("photo").value="";
document.getElementById("designation").value="";
}

// 🔥 NEW GREETING SHARE
function shareDonor(i){

let d = donors[i];

document.getElementById("cardImg").src = d.photo;
document.getElementById("cardName").innerText = d.name;
document.getElementById("cardAmount").innerText = d.amount;
document.getElementById("cardDesignation").innerText = d.designation;

let card = document.getElementById("greetingCard");
card.style.display="block";

html2canvas(card).then(canvas=>{

let img = canvas.toDataURL();
card.style.display="none";

let link=document.createElement("a");
link.href=img;
link.download="donation.png";
link.click();

let msg="🙏 Temple Donation 🙏";
window.open("https://wa.me/?text="+encodeURIComponent(msg));

});
}

function editDonor(i){
let d=donors[i];
document.getElementById("name").value=d.name;
document.getElementById("amount").value=d.amount.replace("₹","");
document.getElementById("photo").value=d.photo;
document.getElementById("designation").value=d.designation;
document.getElementById("vipType").value=d.type;

editIndex=i;
document.getElementById("submitBtn").innerText="Update";
}

function deleteDonor(i){
donors.splice(i,1);
localStorage.setItem("donors",JSON.stringify(donors));
displayDonors();
}

function toggleStatus(i){
donors[i].status = donors[i].status==="done"?"pending":"done";
localStorage.setItem("donors",JSON.stringify(donors));
displayDonors();
}

function openModal(photo,name,amount,designation){
document.getElementById("modalImg").src=photo;
document.getElementById("modalName").innerText=name;
document.getElementById("modalAmount").innerText=amount;
document.getElementById("modalDesignation").innerText=designation;
document.getElementById("modalType").innerText=amount.includes("₹")?"💰":"🧱";
document.getElementById("donorModal").style.display="block";
}

function closeModal(){
document.getElementById("donorModal").style.display="none";
}

window.onclick=function(e){
if(e.target==document.getElementById("donorModal")){
document.getElementById("donorModal").style.display="none";
}
}

function displayDonors(){

let table=document.getElementById("donorTable");
table.innerHTML="";
let total=0;
let serial=1;

donors.forEach((d,i)=>{

if(currentFilter==="vvip" && d.type!=="vvip") return;
if(currentFilter==="normal" && d.type!=="normal") return;

let val=parseInt(d.amount.replace("₹",""))||0;
total+=val;

table.innerHTML+=`
<tr>
<td>${serial++}</td>

<td>
<img src="${d.photo}" onclick="openModal('${d.photo}','${d.name}','${d.amount}','${d.designation}')"
style="width:60px;height:60px;border-radius:50%;object-fit:cover;">
</td>

<td>${d.name}</td>
<td>${d.amount}</td>
<td>${d.designation}</td>
<td>${d.type==="vvip"?"👑 VVIP":"🙏 Normal"}</td>
<td>${d.status==="done"?"✔️":"⏳"}</td>

<td>
${isAdmin?`
<button onclick="editDonor(${i})">✏️</button>
<button onclick="toggleStatus(${i})">🔄</button>
<button onclick="deleteDonor(${i})">🗑️</button>
<button onclick="shareDonor(${i})">📤</button>
`:""}
</td>

</tr>`;
});

document.getElementById("totalAmount").innerText="💰 Total Collected: ₹"+total;
}

displayDonors();

</script>

</body>
</html>
