<!DOCTYPE html>
<html>
<head>
<title>Our Donators</title>
<link rel="stylesheet" href="style.css">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

<header>
<h1>🙏 Our Donators 🙏</h1>
<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="events.html">Events</a>
<a href="donate.html">Donate</a>
<a href="contact.html">Contact</a>
<a href="donators.html">Our Donators</a>
</nav>
</header>

<section class="donators-container">

<div style="text-align:center;margin:20px;">
<button onclick="filterDonors('all')">All</button>
<button onclick="filterDonors('vvip')">👑 VVIP</button>
<button onclick="filterDonors('normal')">🙏 Normal</button>
</div>

<h2 id="totalAmount">💰 Total Collected: ₹0</h2>

<div style="text-align:center;">
<button onclick="adminLogin()">🔐 Admin Login</button>
</div>

<div id="adminPanel" style="display:none;text-align:center;">

<input id="name" placeholder="Enter Name">
<input id="amount" placeholder="Enter Amount">
<input id="photo" placeholder="Paste Image URL">
<input id="designation" placeholder="Designation">

<select id="vipType">
<option value="normal">🙏 Normal</option>
<option value="vvip">👑 VVIP</option>
</select>

<br>
<button onclick="addDonor()">Add Donation</button>

</div>

<table class="donators-table">
<thead>
<tr>
<th>S.No</th>
<th>Photo</th>
<th>Name</th>
<th>Donation</th>
<th>Designation</th>
<th>Type</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="donorTable"></tbody>
</table>

</section>

<script>

// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDYSEDrXTyixVYMnQ77C3J_zlCJNahrdAg",
  authDomain: "temple-donations-2f3f6.firebaseapp.com",
  projectId: "temple-donations-2f3f6",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let donors = [];
let isAdmin = false;
let currentFilter = "all";

// 🔥 REALTIME LOAD (VERY IMPORTANT)
function loadDonors(){
db.collection("donors").onSnapshot(snapshot => {
donors = [];
snapshot.forEach(doc => donors.push({id:doc.id,...doc.data()}));
displayDonors();
});
}

// LOGIN
function adminLogin(){
let pass=prompt("Enter Password");
if(pass==="Hs@561986"){
isAdmin=true;
document.getElementById("adminPanel").style.display="block";
}else alert("Wrong Password");
}

// ADD
async function addDonor(){

let name = document.getElementById("name").value;
let amount = document.getElementById("amount").value;
let photo = document.getElementById("photo").value;
let designation = document.getElementById("designation").value;
let type = document.getElementById("vipType").value;

if(!name || !amount){
alert("Enter details");
return;
}

// 🔥 FIX IMAGE
if(!photo){
photo = "https://via.placeholder.com/100";
}

await db.collection("donors").add({
name, amount:"₹"+amount, photo, designation, type, status:"pending"
});

loadDonors();

// CLEAR
document.getElementById("name").value="";
document.getElementById("amount").value="";
document.getElementById("photo").value="";
document.getElementById("designation").value="";
}

// DELETE
async function deleteDonor(i){
await db.collection("donors").doc(donors[i].id).delete();
}

// STATUS
async function toggleStatus(i){
let d = donors[i];
let newStatus = d.status==="done"?"pending":"done";

await db.collection("donors").doc(d.id).update({status:newStatus});
}

// FILTER
function filterDonors(type){
currentFilter=type;
displayDonors();
}

// DISPLAY
function displayDonors(){

let table=document.getElementById("donorTable");
table.innerHTML="";
let total=0;
let s=1;

donors.forEach((d,i)=>{

if(currentFilter==="vvip" && d.type!=="vvip") return;
if(currentFilter==="normal" && d.type!=="normal") return;

let val=parseInt(d.amount.replace("₹",""))||0;
total+=val;

table.innerHTML+=`
<tr>
<td>${s++}</td>
<td><img src="${d.photo}" style="width:60px;height:60px;border-radius:50%;object-fit:cover;"></td>
<td>${d.name}</td>
<td>${d.amount}</td>
<td>${d.designation}</td>
<td>${d.type==="vvip"?"👑 VVIP":"🙏 Normal"}</td>
<td>${d.status==="done"?"✔️":"⏳"}</td>

<td>
${isAdmin?`
<button onclick="toggleStatus(${i})">🔄</button>
<button onclick="deleteDonor(${i})">🗑️</button>
`:""}
</td>

</tr>`;
});

document.getElementById("totalAmount").innerText="💰 Total Collected: ₹"+total;
}

// INIT
loadDonors();

</script>

</body>
</html>
